<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura asistida - El impermeable rojo de Manu</title>
  <style>
    :root {
      --bg: #FFF7F0;
      --card: #FFFFFF;
      --text: #3D4A5C;
      --muted: #8A94A6;
      --blue: #8EC5FC;
      --blue-dark: #5BA4F0;
      --mint: #B8F0D0;
      --green: #4CC38A;
      --peach: #FFD9B8;
      --yellow: #FFE08A;
      --orange: #FFB347;
      --lilac: #E6DDFB;
      --reading-bg: #F4F8FF;
      --red: #FF7B7B;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, Verdana, sans-serif;
      background: linear-gradient(160deg, var(--bg) 0%, #EAF4FF 100%);
      color: var(--text);
      margin: 0;
      padding: 12px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .container {
      max-width: 780px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border-radius: 28px;
      padding: 18px 24px;
      box-shadow: 0 12px 36px rgba(120, 140, 180, 0.18);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 3px dashed var(--lilac);
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .tutor {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      font-size: 36px;
      background: var(--lilac);
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .tutor-label {
      font-size: 14px;
      color: var(--muted);
    }

    .tutor-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--blue-dark);
    }

    .stars-box {
      font-size: 22px;
      font-weight: 700;
      background: var(--yellow);
      color: #7A5A00;
      padding: 8px 18px;
      border-radius: 999px;
    }

    .status-banner {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      background: var(--mint);
      color: #1E6B48;
      border-radius: 16px;
      padding: 8px 14px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .status-banner.warn { background: var(--peach); color: #8A4B0F; }
    .status-banner.celebrate { background: var(--yellow); color: #7A5A00; }

    .reading-box {
      font-size: 24px;
      line-height: 1.8;
      background: var(--reading-bg);
      padding: 16px 20px;
      border-radius: 20px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      margin-bottom: 14px;
      word-wrap: break-word;
    }

    .reading-box p {
      margin: 0 0 14px 0;
      padding-bottom: 12px;
      border-bottom: 2px dotted #D6E4FA;
    }

    .reading-box p:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .word {
      display: inline-block;
      padding: 0 6px;
      margin: 2px 1px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .word:hover { background-color: #DCE8FA; }

    .word.read {
      background-color: var(--green);
      color: #FFFFFF;
      font-weight: bold;
    }

    .word.active {
      background-color: #DCE8FA;
      border-bottom: 4px solid var(--blue-dark);
      animation: pulse 1.4s infinite;
    }

    .word.helped {
      background-color: var(--orange);
      color: #FFFFFF;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    button {
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 26px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 14px rgba(100, 130, 180, 0.22);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    button:hover { box-shadow: 0 8px 18px rgba(100, 130, 180, 0.3); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-mic { background: var(--blue); color: #14467A; }
    .btn-mic.listening {
      background: var(--red);
      color: #FFFFFF;
      animation: pulse-red 1.4s infinite;
    }

    .btn-model { background: var(--lilac); color: #4A3A8A; }
    .btn-model.speaking { background: var(--peach); color: #8A4B0F; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(255, 123, 123, 0.5); }
      70% { box-shadow: 0 0 0 16px rgba(255, 123, 123, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 123, 123, 0); }
    }

    @media (max-width: 520px) {
      body { padding: 8px; }
      .container { padding: 12px; }
      .reading-box { font-size: 20px; }
      .controls { gap: 8px; }
      button { flex: 1; justify-content: center; padding: 10px 12px; font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="tutor">
      <div class="avatar">👩‍🏫</div>
      <div>
        <div class="tutor-label">Tutora virtual</div>
        <div class="tutor-name">Lina</div>
      </div>
    </div>
    <div class="stars-box">⭐ <span id="stars">0</span></div>
  </div>

  <div class="status-banner" id="statusBanner">
    Hola, soy Lina. Toca el micrófono para empezar a leer o toca cualquier palabra si necesitas ayuda.
  </div>

  <div class="reading-box" id="textContainer"></div>

  <div class="controls">
    <button id="btnListen" class="btn-mic">🎤 <span id="btnListenText">Empezar a leer</span></button>
    <button id="btnReadAll" class="btn-model">🔊 <span id="btnReadAllText">Escuchar cuento completo</span></button>
  </div>
</div>

<script>
  // ===== Texto canónico =====
  // Cada párrafo es una sola línea continua; la separación entre párrafos es exclusivamente '\n\n'
  const storyParagraphs = [
    "El domingo, los padres de Manu le compraron un impermeable rojo. -¿Ma, lo puedo usar ahora? -preguntó Manu. -No, cariño. La lluvia está cerca, pero ahora mismo el cielo está despejado -dijo mamá.",
    "El lunes estaba brillante y soleado. -¿Hoy lloverá, mami? -preguntó Manu. -No, Manu, hoy no. ¡Si usas el impermeable, te verás muy gracioso! -dijo mamá.",
    "El martes, el cielo estaba despejado. -¿Ma, cuándo se cumplirá mi deseo? -preguntó Manu. -Hoy no, cariño. ¡Solo hay una nube blanca en el cielo! -dijo mamá.",
    "El miércoles hacía calor. -¿Ma, por qué no llueve? -preguntó Manu. -Hijo, creo que lloverá muy pronto. Tal vez incluso antes del mediodía -dijo mamá.",
    "El jueves, Manu fue a un pícnic. -¿Ma, qué pasa si llueve? ¿Debería llevar el impermeable conmigo? -preguntó Manu. -No, cariño. Hoy no lloverá. Las nubes están muy altas -dijo mamá.",
    "El viernes estaba nublado. -¿Ma, lloverá hoy? -preguntó Manu en voz alta. -Es posible, cariño. Hay algunas nubes grises en el cielo -dijo mamá.",
    "El sábado inició con un ¡bang! ¡Cataplum! -¿Ma, eso fue un trueno? ¿Lloverá muy pronto? -preguntó Manu.",
    "Y luego, por fin, ¡comenzó a llover! -Oh, está lloviendo, está lloviendo -cantó Manu, corriendo hacia afuera.",
    "-Pero, Manu -llamó mamá, corriendo detrás de él-, ¡te olvidaste el impermeable!"
  ];
  const canonicalText = storyParagraphs.join('\n\n');

  // ===== Referencias al DOM =====
  const textContainer = document.getElementById('textContainer');
  const btnListen = document.getElementById('btnListen');
  const btnListenText = document.getElementById('btnListenText');
  const btnReadAll = document.getElementById('btnReadAll');
  const btnReadAllText = document.getElementById('btnReadAllText');
  const statusBanner = document.getElementById('statusBanner');
  const starsDisplay = document.getElementById('stars');

  // ===== Estado =====
  let allSpans = [];
  let currentWordIndex = 0;
  let recognition = null;
  let isListening = false;
  let isNarrating = false;
  let starsCount = 0;
  let consumedPerResult = {}; // palabras ya procesadas por resultado de reconocimiento
  let lastRestartAt = 0;
  let isPausedForTTS = false;   // el micrófono está en pausa mientras suena la ayuda de Lina
  let helpToken = 0;            // identifica la ayuda de voz más reciente
  let narrationActiveIndex = -1; // palabra resaltada durante la lectura guiada
  let lastParagraphRewarded = -1; // último párrafo completado que ya dio estrellas
  let hesitationTimer = null;     // temporizador de ayuda espontánea
  let paragraphEnds = [];         // índice global de la última palabra de cada párrafo

  const synth = window.speechSynthesis;

  // ===== Utilidades =====
  const PUNCT_REGEX = /[¿?¡!\-–—,.;:"“”«»'()\[\]{}_*\/\\#$%^&=~`]/g;

  // Normaliza: minúsculas, sin puntuación en español y sin acentos
  function normalize(word) {
    return word
      .toLowerCase()
      .replace(PUNCT_REGEX, '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim();
  }

  function setStatus(message, type) {
    statusBanner.textContent = message;
    statusBanner.className = 'status-banner' + (type ? ' ' + type : '');
  }

  // ===== Renderizado =====
  function renderText() {
    textContainer.innerHTML = '';
    allSpans = [];
    paragraphEnds = [];
    const paragraphs = canonicalText.split('\n\n');
    let globalIndex = 0;

    paragraphs.forEach(paragraphText => {
      const p = document.createElement('p');
      const words = paragraphText.trim().split(/\s+/);

      words.forEach(wordText => {
        const clean = normalize(wordText);
        const span = document.createElement('span');
        span.classList.add('word');
        span.dataset.clean = clean;
        span.dataset.index = globalIndex;
        span.textContent = wordText;
        span.addEventListener('click', () => handleWordClick(wordText, span));
        p.appendChild(span);
        p.appendChild(document.createTextNode(' '));
        allSpans.push(span);
        globalIndex++;
      });

      paragraphEnds.push(globalIndex - 1);
      textContainer.appendChild(p);
    });
  }

  // ===== Síntesis de voz (TTS) =====
  function getSpanishVoice() {
    const voices = synth.getVoices();
    return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('es')) || null;
  }

  function createUtterance(text) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    u.rate = 0.85;
    const voice = getSpanishVoice();
    if (voice) u.voice = voice;
    return u;
  }

  function speakText(text, callback) {
    if (!synth) {
      if (callback) callback();
      return;
    }
    synth.cancel();
    const u = createUtterance(text);
    if (callback) {
      u.onend = callback;
      u.onerror = callback;
    }
    synth.speak(u);
  }

  // Tap-to-Help: pronuncia la palabra sola y la resalta en naranja.
  // Si el micrófono está activo, se pausa mientras suena el audio y se reanuda al terminar.
  function handleWordClick(wordText, element) {
    const clean = wordText.replace(PUNCT_REGEX, '').trim();
    if (!clean) return;
    element.classList.add('helped');
    setStatus(`Lina pronuncia: "${clean}"`, '');
    clearTimeout(hesitationTimer);
    if (isNarrating) stopNarration();

    const myToken = ++helpToken;
    const resumeListening = () => {
      if (myToken !== helpToken) return; // hay una ayuda más reciente en curso
      isPausedForTTS = false;
      if (isListening && recognition) {
        if (permissionPersists) {
          consumedPerResult = {};
          try {
            lastRestartAt = Date.now();
            recognition.start();
          } catch (e) {
            // si aún se estaba deteniendo, onend lo reanudará
          }
        }
        resetHesitationTimer();
      }
    };

    if (isListening && recognition) {
      isPausedForTTS = true;
      // Con permiso persistente se detiene el micrófono. Sin él, detenerlo y reiniciarlo
      // volvería a pedir permiso, así que solo se ignora lo que oye mientras Lina habla.
      if (permissionPersists) {
        try { recognition.stop(); } catch (e) {}
      }
    }
    speakText(clean, resumeListening);
  }

  // ===== Modo lectura guiada (Escuchar cuento completo) =====
  function startNarration() {
    if (!synth) {
      setStatus('Tu navegador no puede leer en voz alta. Prueba con Google Chrome o Microsoft Edge.', 'warn');
      return;
    }
    stopListening();
    synth.cancel();
    isNarrating = true;
    btnReadAll.classList.add('speaking');
    btnReadAllText.textContent = 'Detener lectura';
    setStatus('Escucha cómo lee Lina el cuento completo...', '');

    allSpans.forEach(s => s.classList.remove('active'));
    narrationActiveIndex = -1;

    // Se narra por párrafos para evitar cortes en textos largos
    const paragraphs = canonicalText.split('\n\n').map(p => p.trim()).filter(Boolean);
    let baseIndex = 0; // índice global de la primera palabra del párrafo

    paragraphs.forEach((paragraph, i) => {
      // Posición (charIndex) donde empieza cada palabra dentro del párrafo
      const offsets = [];
      const wordRegex = /\S+/g;
      let match;
      while ((match = wordRegex.exec(paragraph)) !== null) offsets.push(match.index);

      const startIndex = baseIndex;
      baseIndex += offsets.length;

      const u = createUtterance(paragraph);

      u.onstart = () => {
        if (isNarrating) setNarrationWord(startIndex);
      };

      // Ilumina en tiempo real la palabra que Lina está leyendo
      u.onboundary = (event) => {
        if (!isNarrating) return;
        if (event.name && event.name !== 'word') return;
        let w = 0;
        for (let k = 0; k < offsets.length; k++) {
          if (offsets[k] <= event.charIndex) w = k;
          else break;
        }
        setNarrationWord(startIndex + w);
      };

      if (i === paragraphs.length - 1) {
        u.onend = () => {
          if (isNarrating) {
            finishNarrationUI();
            setStatus('¡Ahora es tu turno de leer!', '');
          }
        };
      }
      u.onerror = () => {};
      synth.speak(u);
    });
  }

  // Mueve el resaltado (.active) de la narración y mantiene la palabra visible
  function setNarrationWord(index) {
    if (narrationActiveIndex >= 0 && allSpans[narrationActiveIndex]) {
      allSpans[narrationActiveIndex].classList.remove('active');
    }
    narrationActiveIndex = index;
    if (index >= 0 && allSpans[index]) {
      allSpans[index].classList.add('active');
      allSpans[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function finishNarrationUI() {
    isNarrating = false;
    setNarrationWord(-1);
    btnReadAll.classList.remove('speaking');
    btnReadAllText.textContent = 'Escuchar cuento completo';
  }

  function stopNarration() {
    if (synth) synth.cancel();
    finishNarrationUI();
  }

  // ===== Reconocimiento de voz (ASR) =====
  function setupSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      setStatus('Tu navegador no soporta el reconocimiento de voz. Usa Google Chrome o Microsoft Edge para leer con Lina. Aún puedes tocar las palabras y escuchar el cuento.', 'warn');
      btnListen.disabled = true;
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'es-ES';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const words = event.results[i][0].transcript.trim().split(/\s+/).filter(Boolean);
        const already = consumedPerResult[i] || 0;
        const fresh = words.slice(already);
        if (fresh.length) {
          consumedPerResult[i] = words.length;
          if (!isPausedForTTS) processSpokenWords(fresh); // se ignora lo que el micrófono oye de Lina
        }
      }
    };

    recognition.onerror = (event) => {
      if (event.error === 'no-speech' || event.error === 'aborted') return; // tolerados: onend reconecta
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        stopListening();
        setStatus('Necesito permiso para usar el micrófono. Actívalo en tu navegador e inténtalo de nuevo.', 'warn');
        return;
      }
      if (event.error === 'audio-capture') {
        stopListening();
        setStatus('No encuentro un micrófono. Revisa que esté conectado.', 'warn');
        return;
      }
      console.warn('Error de reconocimiento:', event.error);
    };

    // Reconexión fluida si el micrófono se detiene solo
    recognition.onend = () => {
      consumedPerResult = {};
      if (!isListening) return;

      // Sin permiso persistente, reiniciar el micrófono volvería a pedir permiso una y otra vez
      if (!permissionPersists) {
        stopListening();
        setStatus('El micrófono se detuvo. Toca "Empezar a leer" para continuar. Consejo: abre esta página desde http://localhost o https para que el permiso se recuerde.', 'warn');
        return;
      }

      if (isPausedForTTS) return;
      const wait = Math.max(0, 300 - (Date.now() - lastRestartAt));
      setTimeout(() => {
        if (!isListening) return;
        try {
          lastRestartAt = Date.now();
          recognition.start();
        } catch (e) {
          // ya estaba iniciado; se ignora
        }
      }, wait);
    };
  }

  function markRead(index) {
    allSpans[index].classList.remove('active', 'helped');
    allSpans[index].classList.add('read');
  }

  function focusCurrent() {
    if (currentWordIndex < allSpans.length) {
      const el = allSpans[currentWordIndex];
      el.classList.add('active');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function matches(spoken, expected) {
    if (!spoken || !expected) return false;
    if (spoken === expected) return true;
    // Tolerancia: una palabra contenida en la otra (mínimo 3 letras)
    if (spoken.length >= 3 && expected.length >= 3) {
      return spoken.includes(expected) || expected.includes(spoken);
    }
    return false;
  }

  function skipEmptyTokens() {
    // Palabras que quedan vacías tras normalizar (por ejemplo un guion suelto) se dan por leídas
    while (currentWordIndex < allSpans.length && allSpans[currentWordIndex].dataset.clean === '') {
      markRead(currentWordIndex);
      currentWordIndex++;
    }
  }

  // ===== Andamiaje proactivo (si el niño se traba) =====
  function resetHesitationTimer() {
    clearTimeout(hesitationTimer);
    if (!isListening) return;

    // Si pasan 4 segundos sin avanzar, Lina ofrece ayuda espontánea
    hesitationTimer = setTimeout(() => {
      if (isListening && currentWordIndex < allSpans.length) {
        const targetWord = allSpans[currentWordIndex].textContent.trim();
        setStatus(`💡 Lina sugiere: Toca "${targetWord}" si necesitas escucharla.`, 'warn');
      }
    }, 4000);
  }

  function processSpokenWords(spokenWords) {
    let advanced = false;

    spokenWords.forEach(raw => {
      if (currentWordIndex >= allSpans.length) return;
      const spoken = normalize(raw);
      if (!spoken) return;

      skipEmptyTokens();
      if (currentWordIndex >= allSpans.length) return;

      // Coincidencia con la palabra actual o, por tolerancia, con una de las 2 siguientes
      let hit = -1;
      for (let look = 0; look <= 2 && currentWordIndex + look < allSpans.length; look++) {
        const expected = allSpans[currentWordIndex + look].dataset.clean;
        if (matches(spoken, expected)) { hit = currentWordIndex + look; break; }
      }

      if (hit >= 0) {
        allSpans[currentWordIndex].classList.remove('active');
        while (currentWordIndex <= hit) {
          markRead(currentWordIndex);
          currentWordIndex++;
        }
        skipEmptyTokens();
        advanced = true;
      }
    });

    if (advanced) {
      resetHesitationTimer();

      // Premio progresivo: +2 estrellas por cada párrafo completado
      while (lastParagraphRewarded + 1 < paragraphEnds.length &&
             paragraphEnds[lastParagraphRewarded + 1] < currentWordIndex) {
        lastParagraphRewarded++;
        starsCount += 2;
        starsDisplay.textContent = starsCount;
      }

      if (currentWordIndex >= allSpans.length) {
        completeReading();
        return;
      }
      focusCurrent();
      setStatus('¡Muy bien! Sigue leyendo sobre Manu...', '');
    }
  }

  // ===== Fin de la lectura =====
  function completeReading() {
    stopListening();
    starsCount += 15;
    starsDisplay.textContent = starsCount;
    setStatus('🎉 ¡Felicidades! Terminaste de leer "El impermeable rojo de Manu". ¡Ganaste 15 estrellas! ⭐', 'celebrate');
    speakText('¡Felicidades! Leíste todo el cuento del impermeable rojo de Manu. ¡Ganaste quince estrellas!');
  }

  // ===== Control del micrófono =====
  // El navegador solo recuerda el permiso del micrófono en https o localhost.
  // Abierto como archivo (file://) lo vuelve a pedir cada vez que se inicia el reconocimiento.
  const permissionPersists = location.protocol === 'https:' ||
    location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  // Solo consulta el estado del permiso. El único aviso real lo lanza recognition.start(),
  // así que ya no hay una segunda petición con getUserMedia.
  async function ensureMic() {
    try {
      if (navigator.permissions && navigator.permissions.query) {
        const perm = await navigator.permissions.query({ name: 'microphone' });
        if (perm.state === 'denied') {
          setStatus('El micrófono está bloqueado. Toca el candado junto a la dirección, permite el micrófono y recarga la página.', 'warn');
          return false;
        }
      }
    } catch (e) {
      // Permissions API no disponible: se continúa
    }
    return true;
  }

  async function startListening() {
    if (!recognition) return;
    setStatus('Acepta el permiso del micrófono cuando el navegador te lo pida.', '');
    const ok = await ensureMic();
    if (!ok) return;
    if (isNarrating) stopNarration();
    if (synth) synth.cancel();

    // Si ya se completó, o es la primera vez, se empieza desde el principio
    if (currentWordIndex >= allSpans.length || currentWordIndex === 0) {
      currentWordIndex = 0;
      lastParagraphRewarded = -1;
      allSpans.forEach(s => s.className = 'word');
    }
    skipEmptyTokens();

    isListening = true;
    consumedPerResult = {};
    focusCurrent();
    resetHesitationTimer();

    try {
      lastRestartAt = Date.now();
      recognition.start();
    } catch (e) {
      // ya estaba iniciado
    }

    btnListen.classList.add('listening');
    btnListenText.textContent = 'Detener lectura';
    setStatus('Lina te escucha... ¡Empieza a leer en voz alta!', '');
  }

  function stopListening() {
    const wasListening = isListening;
    isListening = false;
    isPausedForTTS = false;
    clearTimeout(hesitationTimer);
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }
    btnListen.classList.remove('listening');
    btnListenText.textContent = 'Empezar a leer';
    if (wasListening && currentWordIndex < allSpans.length && currentWordIndex > 0) {
      setStatus('Micrófono en pausa. Toca "Empezar a leer" para continuar donde ibas.', '');
    }
  }

  function toggleListening() {
    if (isListening) stopListening();
    else startListening();
  }

  // ===== Eventos =====
  btnListen.addEventListener('click', toggleListening);

  btnReadAll.addEventListener('click', () => {
    if (isNarrating) {
      stopNarration();
      setStatus('Lectura detenida. ¡Cuando quieras, es tu turno de leer!', '');
    } else {
      startNarration();
    }
  });

  if (synth && typeof synth.onvoiceschanged !== 'undefined') {
    synth.onvoiceschanged = () => {};
  }

  // ===== Inicialización =====
  renderText();
  setupSpeechRecognition();
  // Al abrir la app se pide el permiso y, en cuanto se acepta, empieza a escuchar sola
  if (recognition) startListening();
</script>

</body>
</html>
